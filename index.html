<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rollino</title>
    
    <!-- Google Font: Poetsen One (used selectively for game UI headings/buttons) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poetsen+One&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Allows the browser to read JSX syntax directly) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<!-- The continuous aqua background is now safely anchored to the body -->
<body class="bg-app-gradient m-0 p-0 overflow-x-hidden text-gray-800 font-sans">
    
    <!-- React Injection Point -->
    <div id="root"></div>

    <!-- Main Application Logic -->
    <script type="text/babel" src="script/script.jsx"></script>
</body>
</html>
