<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rollino</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles (pointing to the css folder) -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Allows the browser to read JSX syntax directly) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#92d9df] m-0 p-0 overflow-hidden">
    <!-- This is where React will inject the game -->
    <div id="root"></div>

    <!-- Main Application Logic (pointing to the script folder) -->
    <script type="text/babel" src="script/script.jsx"></script>
</body>
</html>
